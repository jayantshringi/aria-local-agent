<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)" />
  <rect width="512" height="512" rx="104" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Outer Ambient Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.4" stroke-dasharray="16 12" />

  <!-- Active Glowing Ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#ringGrad)" stroke-width="8" filter="url(#neonGlow)" />

  <!-- Inner Concentric Orbit -->
  <circle cx="256" cy="256" r="95" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.6" />

  <!-- Central Intelligence Core / Glyph -->
  <g filter="url(#neonGlow)">
    <!-- Central Hexagonal Core -->
    <path d="M 256 186 L 316 221 L 316 291 L 256 326 L 196 291 L 196 221 Z" fill="url(#coreGrad)" opacity="0.85" />
    <!-- Core Center Highlight -->
    <circle cx="256" cy="256" r="26" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- Soundwave / Neural Signal Accents -->
  <line x1="256" y1="120" x2="256" y2="140" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="372" x2="256" y2="392" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" />
  <line x1="120" y1="256" x2="140" y2="256" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
  <line x1="372" y1="256" x2="392" y2="256" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
</svg>
